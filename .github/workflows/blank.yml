name: Scraper Seconde Main & IA

on:
  schedule:
    # S'exécute toutes les 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Permet le lancement manuel

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restaurer la base de données SQLite
        uses: actions/cache@v4
        with:
          path: vu_articles.db
          key: sqlite-db-${{ github.run_id }}
          restore-keys: |
            sqlite-db-

      - name: Exécuter le bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Sauvegarder la base de données SQLite
        uses: actions/cache@v4
        with:
          path: vu_articles.db
          key: sqlite-db-${{ github.run_id }}
